<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#05070f" />
<title>页面走丢了 · 王睿</title>
<style>
  html,body{height:100%;margin:0}
  body{
    display:grid;place-items:center;background:#05070f;color:#eaf0ff;
    font-family:"Inter","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden;
  }
  .bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 90% at 50% -10%,#0a0f1f 0%,#05070f 60%)}
  .blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;mix-blend-mode:screen;z-index:-1}
  .b1{width:46vw;height:46vw;left:-8vw;top:-6vw;background:radial-gradient(circle at 30% 30%,#7c5cff,transparent 70%)}
  .b2{width:40vw;height:40vw;right:-6vw;top:6vh;background:radial-gradient(circle at 60% 40%,#22d3ee,transparent 70%)}
  .card{
    max-width:560px;margin:20px;padding:44px 46px;border-radius:20px;text-align:center;
    background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
    box-shadow:0 18px 50px -18px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.16);
  }
  h1{
    margin:0 0 10px;font-size:44px;font-weight:900;letter-spacing:.06em;
    background:linear-gradient(115deg,#fff 8%,#c9b8ff 38%,#7dd3fc 66%,#f9a8d4 92%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  p{margin:8px 0;color:rgba(234,240,255,.66);font-size:14.5px;line-height:1.7}
  a.home{
    display:inline-block;margin-top:22px;padding:12px 28px;border-radius:999px;
    text-decoration:none;color:#fff;font-weight:600;font-size:14.5px;
    background:linear-gradient(120deg,#7c5cff,#5b8cff 55%,#22d3ee);
    box-shadow:0 16px 38px -14px rgba(124,92,255,.95);
  }
</style>
</head>
<body>
<div class="bg"></div><span class="blob b1"></span><span class="blob b2"></span>
<div class="card">
  <h1>404</h1>
  <p>这个地址没有内容。</p>
  <p>可能链接输错了，或者这一页还没做。</p>
  <a class="home" href="/">回到首页</a>
</div>
</body>
</html>
